name: Localize generated art

on:
  push:
    branches: [fix/local-art-assets]
    paths:
      - .github/workflows/localize-art.yml
      - .localize-art-trigger

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/local-art-assets
      - name: Download approved generated artwork into the app
        run: |
          mkdir -p public/assets
          curl --fail --location --retry 3 'https://gcdn.picsart.com/editing-temp/0b9eed0f-d8b0-4ca1-b4bf-fd1f9afcf24c.png' -o public/assets/monster-workshop-background.png
          curl --fail --location --retry 3 'https://gcdn.picsart.com/editing-temp/ab4d4d16-4815-486d-a500-c34931420134.png' -o public/assets/monster-ui-assets.png
          test -s public/assets/monster-workshop-background.png
          test -s public/assets/monster-ui-assets.png
      - name: Commit binary assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/monster-workshop-background.png public/assets/monster-ui-assets.png
          git commit -m 'art: store generated workshop assets locally'
          git push origin HEAD:fix/local-art-assets
