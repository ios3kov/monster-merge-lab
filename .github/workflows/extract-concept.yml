name: Extract concept modules
on:
  push:
    branches: [ui/modular-concept-assets]
    paths: [.extract-concept-trigger]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/modular-concept-assets
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick webp
          curl --fail --location --retry 3 'https://gcdn.picsart.com/editing-temp/f9b5aa1a-03bc-48e8-b352-0bc1f7630cea.jpeg' -o /tmp/concept.jpg
          mkdir -p public/assets/concept
          # Logo, top HUD frame, tank frame and bottom navigation are independent concept modules.
          convert /tmp/concept.jpg -crop 600x125+170+0 +repage -resize 600x125 -quality 78 public/assets/concept/logo.webp
          convert /tmp/concept.jpg -crop 865x205+38+120 +repage -resize 865x205 -quality 76 public/assets/concept/hud-frame.webp
          convert /tmp/concept.jpg -crop 865x990+38+315 +repage -resize 865x990 -quality 74 public/assets/concept/tank-frame.webp
          convert /tmp/concept.jpg -crop 865x155+38+1280 +repage -resize 865x155 -quality 76 public/assets/concept/nav-frame.webp
          # Individual HUD skins.
          convert /tmp/concept.jpg -crop 225x165+55+140 +repage -quality 76 public/assets/concept/score-panel.webp
          convert /tmp/concept.jpg -crop 125x165+290+140 +repage -quality 76 public/assets/concept/hold-panel.webp
          convert /tmp/concept.jpg -crop 195x165+420+140 +repage -quality 76 public/assets/concept/next-panel.webp
          convert /tmp/concept.jpg -crop 265x165+620+140 +repage -quality 76 public/assets/concept/orders-panel.webp
          # Remove the concept's example monsters/text from module interiors as much as possible by using the frame skins behind live UI.
          ls -lh public/assets/concept
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/concept
          git commit -m 'art: extract modular UI images from master concept'
          git push origin HEAD:ui/modular-concept-assets
