name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monster-merge-lab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-fund

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Chromium E2E, responsive and accessibility
        run: npm run test:e2e:chromium

      - name: Upload Chromium failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chromium-audit
          path: test-results
          if-no-files-found: ignore
          retention-days: 2

  webkit:
    name: WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-fund

      - name: Build
        run: npm run build

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: WebKit E2E, responsive and accessibility
        run: npm run test:e2e:webkit

      - name: Upload WebKit failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: webkit-audit
          path: test-results
          if-no-files-found: ignore
          retention-days: 2

  offline-pwa:
    name: Offline / PWA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-fund

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Offline app-shell and service-worker smoke
        run: npm run test:e2e:offline

      - name: Upload Offline/PWA failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: offline-pwa-audit
          path: test-results
          if-no-files-found: ignore
          retention-days: 2

  performance:
    name: Performance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-fund

      - name: Physics, build and bundle budgets
        run: npm run verify:performance

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser frame-time smoke
        run: npm run test:e2e:performance

      - name: Upload Performance failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: performance-audit
          path: test-results
          if-no-files-found: ignore
          retention-days: 2

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: production-dist
          path: dist
          if-no-files-found: error
          retention-days: 3

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-fund

      - name: Typecheck, lint, unit and dependency audit
        run: npm run verify:audit

  aggregate-gate:
    name: Aggregate Gate
    if: always()
    needs:
      - chromium
      - webkit
      - offline-pwa
      - performance
      - audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every parallel gate
        env:
          CHROMIUM_RESULT: ${{ needs.chromium.result }}
          WEBKIT_RESULT: ${{ needs.webkit.result }}
          OFFLINE_PWA_RESULT: ${{ needs['offline-pwa'].result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          echo "Chromium: $CHROMIUM_RESULT"
          echo "WebKit: $WEBKIT_RESULT"
          echo "Offline/PWA: $OFFLINE_PWA_RESULT"
          echo "Performance: $PERFORMANCE_RESULT"
          echo "Audit: $AUDIT_RESULT"

          for result in             "$CHROMIUM_RESULT"             "$WEBKIT_RESULT"             "$OFFLINE_PWA_RESULT"             "$PERFORMANCE_RESULT"             "$AUDIT_RESULT"
          do
            if [ "$result" != "success" ]; then
              echo "Required CI gate failed or was cancelled: $result"
              exit 1
            fi
          done

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - aggregate-gate
      - performance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout config
        uses: actions/checkout@v7

      - name: Download verified build
        uses: actions/download-artifact@v8
        with:
          name: production-dist
          path: dist

      - name: Deploy verified build
        run: npx --yes wrangler@4.135.0 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 018d8fa99d7e951d6c5751dd456ba7e1

      - name: Setup Node for production smoke
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install production smoke dependencies
        run: npm ci --no-fund

      - name: Install Chromium for production smoke
        run: npx playwright install --with-deps chromium

      - name: Production interaction smoke
        run: npm run test:e2e:production
        env:
          PLAYWRIGHT_BASE_URL: https://monster-merge-lab.os3kov.workers.dev
