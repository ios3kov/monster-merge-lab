name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monster-merge-lab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-fund

      - name: Verify code, unit tests and budgets
        run: npm run verify

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser, responsive and accessibility smoke tests
        run: npm run test:e2e

      - name: Upload browser audit artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-audit
          path: test-results
          if-no-files-found: ignore
          retention-days: 2

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: production-dist
          path: dist
          if-no-files-found: error
          retention-days: 3


  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout config
        uses: actions/checkout@v7

      - name: Download verified build
        uses: actions/download-artifact@v8
        with:
          name: production-dist
          path: dist

      - name: Deploy verified build
        run: npx --yes wrangler@4.135.0 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 018d8fa99d7e951d6c5751dd456ba7e1

      - name: Smoke live production
        shell: bash
        run: |
          set -euo pipefail
          url="https://monster-merge-lab.os3kov.workers.dev/"
          body="/tmp/monster-merge-index.html"
          headers="/tmp/monster-merge-headers.txt"

          success=0
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --connect-timeout 10 --max-time 30               -D "$headers" -o "$body" "$url" &&
              grep -q "Monster Merge Lab" "$body"; then
              success=1
              break
            fi
            sleep 5
          done
          test "$success" -eq 1

          tr -d '\r' < "$headers" > "$headers.clean"
          grep -qi '^content-security-policy:' "$headers.clean"
          grep -qi '^x-content-type-options: *nosniff' "$headers.clean"
          grep -qi '^referrer-policy: *no-referrer' "$headers.clean"
          grep -qi '^x-frame-options: *DENY' "$headers.clean"
          grep -qi '^permissions-policy:' "$headers.clean"

          asset_path="$(
            grep -oE '/assets/[^" ]+\.js' "$body" | head -n 1
          )"
          test -n "$asset_path"
          curl -fsS --connect-timeout 10 --max-time 30             -D /tmp/monster-merge-asset-headers.txt             -o /dev/null             "https://monster-merge-lab.os3kov.workers.dev${asset_path}"
          tr -d '\r' < /tmp/monster-merge-asset-headers.txt             > /tmp/monster-merge-asset-headers.clean
          grep -qi '^cache-control:.*immutable'             /tmp/monster-merge-asset-headers.clean
