name: Recompress workshop art
on:
  push:
    branches: [fix/local-art-assets]
    paths: [.recompress-art-trigger]
permissions:
  contents: write
jobs:
  recompress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/local-art-assets
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq webp
          curl --fail --location --retry 3 'https://gcdn.picsart.com/editing-temp/0b9eed0f-d8b0-4ca1-b4bf-fd1f9afcf24c.png' -o /tmp/bg.png
          curl --fail --location --retry 3 'https://gcdn.picsart.com/editing-temp/ab4d4d16-4815-486d-a500-c34931420134.png' -o /tmp/ui.png
          cwebp -quiet -q 64 -resize 720 0 /tmp/bg.png -o public/assets/monster-workshop-background.webp
          cwebp -quiet -q 64 -resize 720 0 /tmp/ui.png -o public/assets/monster-ui-assets.webp
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/monster-workshop-background.webp public/assets/monster-ui-assets.webp
          git commit -m 'perf: trim workshop artwork below transfer budget'
          git push origin HEAD:fix/local-art-assets
