name: Extract monster tier atlas
on:
  push:
    branches: [ui/modular-concept-assets]
    paths: [.monster-atlas-trigger]
permissions:
  contents: write
jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { ref: ui/modular-concept-assets }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick webp
          curl --fail --location --retry 3 'https://gcdn.picsart.com/editing-temp/f9b5aa1a-03bc-48e8-b352-0bc1f7630cea.jpeg' -o /tmp/concept.jpg
          # Compact 4x2 atlas cut from the concept's actual monster pile; renderer supplies live faces.
          convert -size 512x256 xc:none             \( /tmp/concept.jpg -crop 105x105+92+885 +repage -resize 128x128 \) -geometry +0+0 -composite             \( /tmp/concept.jpg -crop 105x105+225+875 +repage -resize 128x128 \) -geometry +128+0 -composite             \( /tmp/concept.jpg -crop 110x110+350+850 +repage -resize 128x128 \) -geometry +256+0 -composite             \( /tmp/concept.jpg -crop 120x120+490+835 +repage -resize 128x128 \) -geometry +384+0 -composite             \( /tmp/concept.jpg -crop 135x135+115+980 +repage -resize 128x128 \) -geometry +0+128 -composite             \( /tmp/concept.jpg -crop 150x150+545+1010 +repage -resize 128x128 \) -geometry +128+128 -composite             \( /tmp/concept.jpg -crop 160x160+270+955 +repage -resize 128x128 \) -geometry +256+128 -composite             \( /tmp/concept.jpg -crop 190x190+610+1035 +repage -resize 128x128 \) -geometry +384+128 -composite             /tmp/atlas.png
          cwebp -quiet -q 70 /tmp/atlas.png -o public/assets/concept/monster-tiers.webp
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/concept/monster-tiers.webp
          git commit -m 'art: add compact concept monster tier atlas'
          git push origin HEAD:ui/modular-concept-assets
